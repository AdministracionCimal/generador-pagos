[project]
name = "generador-de-pagos"
version = "0.1.0"
description = "App de escritorio para generar Ordenes de Pago en Finnegans desde planilla DM"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyinstaller>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
